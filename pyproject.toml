[project]
name = "lora-matrix-trainer"
version = "0.1.0"
requires-python = ">=3.10"
description = "Train Anima character LoRA models via CLI — single runs or matrix hyperparameter sweeps"
readme = "README.md"
license = "MIT"
dependencies = [
    "torch",
    "torchvision",
    "accelerate",
    "transformers",
    "diffusers[torch]",
    "safetensors",
    "bitsandbytes",
    "lion-pytorch",
    "pytorch-optimizer",
    "prodigyopt",
    "prodigy-plus-schedule-free",
    "schedulefree",
    "sentencepiece",
    "toml",
    "rich",
    "numpy",
    "einops",
    "opencv-python",
    "ftfy",
    "huggingface-hub",
    "tensorboard",
    "voluptuous",
    "imagesize",
    "triton-windows>=3.7.0.post26",
]

[project.scripts]
lora-train = "scripts.train:main"
lora-evaluate = "scripts.evaluate:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
]

# --- CUDA 12.8 index (RTX 30/40 series) ---
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# --- CUDA 13.0 index (RTX 50 series) ---
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# --- Active CUDA index routing ---
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
